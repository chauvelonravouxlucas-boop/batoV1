<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Télécommande Servo & Moteur</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --text: #f8fafc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin-top: 0; margin-bottom: 6px; }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .status.connected { color: var(--success); font-weight: 600; }
    
    #connectBtn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      margin-bottom: 16px;
    }
    #connectBtn.connected {
      background: #334155;
      color: #e2e8f0;
    }

    .controls {
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .controls.active {
      opacity: 1;
      pointer-events: auto;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-top: 14px;
      margin-bottom: 6px;
      text-align: left;
    }

    .value-display {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin: 2px 0;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      margin: 10px 0;
      accent-color: var(--accent);
    }

    .grid-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .step-btns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    button.preset, button.speed-btn {
      background: #334155;
      color: white;
      border: 2px solid transparent;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button.preset:active {
      background: var(--accent);
      color: #0f172a;
    }
    button.speed-btn.selected {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Télécommande Micro:bit</h1>
    <div id="statusText" class="status">Déconnecté</div>

    <button id="connectBtn" onclick="toggleConnection()">Connecter la micro:bit</button>

    <div id="controlPanel" class="controls">
      <!-- SECTION SERVOMOTEUR -->
      <div class="section-title">Servomoteur (Angle)</div>
      <div class="value-display"><span id="angleLabel">90</span>°</div>
      <input type="range" id="angleSlider" min="0" max="180" value="90" oninput="onSliderAngle(this.value)">

      <div class="grid-btns">
        <button class="preset" onclick="setAngle(0)">0°</button>
        <button class="preset" onclick="setAngle(90)">90°</button>
        <button class="preset" onclick="setAngle(180)">180°</button>
      </div>

      <div class="step-btns">
        <button class="preset" onclick="stepAngle(-10)">- 10°</button>
        <button class="preset" onclick="stepAngle(10)">+ 10°</button>
      </div>

      <div class="section-title">Vitesse de déplacement du Servo</div>
      <div class="grid-btns">
        <button id="spd1" class="speed-btn" onclick="setServoSpeed(1)">Lente</button>
        <button id="spd2" class="speed-btn" onclick="setServoSpeed(2)">Inter.</button>
        <button id="spd3" class="speed-btn selected" onclick="setServoSpeed(3)">Max</button>
      </div>

      <!-- SECTION MOTEUR DC OPITEC -->
      <div class="section-title">Moteur DC Opitec (Vitesse)</div>
      <div class="value-display"><span id="motorLabel">0</span>%</div>
      <input type="range" id="motorSlider" min="0" max="1023" value="0" oninput="onSliderMotor(this.value)">
      
      <div class="grid-btns">
        <button class="preset" onclick="setMotorPWM(0)">Arrêt</button>
        <button class="preset" onclick="setMotorPWM(512)">50%</button>
        <button class="preset" onclick="setMotorPWM(1023)">100%</button>
      </div>
    </div>
  </div>

  <script>
    const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const UART_CHAR_UUID_RX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let device = null;
    let writeCharacteristic = null;
    let currentAngle = 90;
    let isSending = false;
    let pendingCommand = null;

    async function toggleConnection() {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
        return;
      }

      try {
        document.getElementById('statusText').innerText = "Recherche en cours...";
        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'BBC micro:bit' }],
          optionalServices: [UART_SERVICE_UUID]
        });

        device.addEventListener('gattserverdisconnected', onDisconnected);

        document.getElementById('statusText').innerText = "Connexion GATT...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE_UUID);
        writeCharacteristic = await service.getCharacteristic(UART_CHAR_UUID_RX);

        const statusEl = document.getElementById('statusText');
        statusEl.innerText = "Connecté à " + device.name;
        statusEl.classList.add('connected');

        const btn = document.getElementById('connectBtn');
        btn.innerText = "Déconnecter";
        btn.classList.add('connected');

        document.getElementById('controlPanel').classList.add('active');

      } catch (err) {
        console.error(err);
        document.getElementById('statusText').innerText = "Erreur : " + err.message;
      }
    }

    function onDisconnected() {
      writeCharacteristic = null;
      const statusEl = document.getElementById('statusText');
      statusEl.innerText = "Déconnecté";
      statusEl.classList.remove('connected');

      const btn = document.getElementById('connectBtn');
      btn.innerText = "Connecter la micro:bit";
      btn.classList.remove('connected');

      document.getElementById('controlPanel').classList.remove('active');
    }

    function onSliderAngle(val) {
      setAngle(parseInt(val));
    }

    function stepAngle(delta) {
      let next = Math.max(0, Math.min(180, currentAngle + delta));
      setAngle(next);
    }

    function setAngle(val) {
      currentAngle = val;
      document.getElementById('angleLabel').innerText = val;
      document.getElementById('angleSlider').value = val;
      sendCommandBLE(val.toString());
    }

    function setServoSpeed(level) {
      document.getElementById('spd1').classList.toggle('selected', level === 1);
      document.getElementById('spd2').classList.toggle('selected', level === 2);
      document.getElementById('spd3').classList.toggle('selected', level === 3);
      sendCommandBLE("V" + level);
    }

    function onSliderMotor(val) {
      let pwm = parseInt(val);
      let pct = Math.round((pwm / 1023) * 100);
      document.getElementById('motorLabel').innerText = pct;
      sendCommandBLE("S" + pwm);
    }

    function setMotorPWM(pwm) {
      document.getElementById('motorSlider').value = pwm;
      let pct = Math.round((pwm / 1023) * 100);
      document.getElementById('motorLabel').innerText = pct;
      sendCommandBLE("S" + pwm);
    }

    async function sendCommandBLE(cmd) {
      if (!writeCharacteristic) return;
      pendingCommand = cmd;
      if (isSending) return;

      isSending = true;
      while (pendingCommand !== null) {
        const target = pendingCommand;
        pendingCommand = null;
        const data = new TextEncoder().encode(target + "\n");
        try {
          await writeCharacteristic.writeValue(data);
        } catch (e) {
          try {
            await writeCharacteristic.writeValueWithoutResponse(data);
          } catch (err) {
            console.error("Erreur BLE :", err);
          }
        }
        await new Promise(r => setTimeout(r, 30));
      }
      isSending = false;
    }
  </script>
</body>
</html>
